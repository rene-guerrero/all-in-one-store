<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>All in One · Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <img class="brand-logo" src="favicon.svg" alt="" width="36" height="36">
      <div class="brand-text">
        <h1>Admin de imágenes</h1>
        <div class="brand-sub"><p id="who">All in One</p></div>
      </div>
      <div class="header-actions">
        <button class="btn btn-icon theme-toggle" data-theme-toggle aria-label="Cambiar modo claro/oscuro" title="Modo claro/oscuro">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="btn" href="./">Ver tienda</a>
        <button class="btn" id="logout" hidden>Salir</button>
      </div>
    </div>
  </header>

  <form class="panel login-card" id="login" hidden>
    <h2 style="margin:0">Entrar</h2>
    <input type="email" id="email" placeholder="Correo" autocomplete="username" required>
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Entrar</button>
    <div class="status" id="login-status"></div>
  </form>

  <main class="wrap" id="app" hidden>
    <div class="admin-layout">
      <section class="panel">
        <div class="panel-head">
          <input id="filter" class="search" type="search" placeholder="Buscar producto…" autocomplete="off">
          <select id="filter-images" class="select">
            <option value="">Todos los productos</option>
            <option value="none">Sin imágenes</option>
            <option value="some">Con imágenes</option>
          </select>
          <small class="status" id="list-info"></small>
        </div>
        <ul class="product-list" id="products"></ul>
      </section>

      <section class="panel editor" id="editor">
        <p class="status">Elige un producto de la lista para subir o editar sus imágenes.</p>
      </section>
    </div>
  </main>
</body>
</html>
