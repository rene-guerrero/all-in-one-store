<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All in One · Catálogo</title>
  <meta name="description" content="All in One: covers, micas, cables y accesorios para celulares en Holguín. Servicio a domicilio. Consulta disponibilidad por WhatsApp.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=556350">
  <script src="theme.js?v=556350"></script>
  <script src="config.js?v=556350"></script>
  <script src="multiselect.js?v=1"></script>
  <script src="catalog.js?v=556350"></script>
  <script src="app.js?v=556350" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <img class="brand-logo" src="favicon.svg" alt="" width="36" height="36">
      <div class="brand-text">
        <h1 data-store="name">All in One</h1>
        <div class="brand-sub">
          <p data-store="tagline"></p>
          <span class="delivery">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h12v10H2zM14 9h4.5l3.5 3.5V16h-8z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></svg>
            <span data-store="delivery"></span>
          </span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-icon theme-toggle" data-theme-toggle aria-label="Cambiar modo claro/oscuro" title="Modo claro/oscuro">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="btn btn-whatsapp" id="header-whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
          <span class="label">WhatsApp</span>
        </a>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap">
      <label class="sr-only" for="search">Buscar</label>
      <input id="search" class="search" type="search" placeholder="Buscar modelo, ej. Samsung A15, iPhone 13…" autocomplete="off">
      <div class="filter-row">
        <div class="filter-ms" id="brand-ms"></div>
        <div class="filter-ms category-ms" id="category-ms"></div>
        <div class="chips" id="categories" role="group" aria-label="Categorías"></div>
      </div>
    </div>
  </div>

  <main class="wrap">
    <div class="result-bar">
      <p class="result-info" id="result-info" aria-live="polite"></p>
      <label class="sort-select">Ordenar
        <select id="sort">
          <option value="novedades">Novedades</option>
          <option value="az">A–Z</option>
        </select>
      </label>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div><strong>Dirección:</strong> <span data-store="address"></span></div>
      <div><strong>Teléfono:</strong> <a id="footer-phone"></a></div>
      <div class="footer-delivery" data-store="delivery"></div>
      <div><a id="footer-facebook" target="_blank" rel="noopener">Facebook</a></div>
    </div>
  </footer>

  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <button class="btn btn-sm viewer-close" id="viewer-close" aria-label="Cerrar">✕</button>
    <div class="viewer-grid">
      <div>
        <div class="gallery" id="gallery"></div>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <div class="viewer-info">
        <div class="card-category" id="viewer-category"></div>
        <h2 id="viewer-title"></h2>
        <span class="availability">Disponible</span>
        <p class="viewer-description" id="viewer-description" hidden></p>
        <p class="note">Escríbenos por WhatsApp para precio y disponibilidad. Tenemos servicio a domicilio. Inventario actualizado diariamente.</p>
        <a class="btn btn-whatsapp" id="viewer-whatsapp" target="_blank" rel="noopener">Consultar por WhatsApp</a>
      </div>
    </div>
  </dialog>
</body>
</html>
